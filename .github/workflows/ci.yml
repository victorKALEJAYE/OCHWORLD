# OCHWORLD pipeline. On every push and pull request:
#   1. app       typecheck, unit tests, production build
#   2. database  build the database from the migrations in a throwaway Postgres
#                and run the 100+ security (RLS) tests
#   3. migrate   only if 1 and 2 passed:
#                  staging branch → STAGING Supabase project
#                  main branch    → PRODUCTION Supabase project
# Vercel deploys the website separately (staging branch → preview link,
# main → live site). See docs/architecture.md, "Delivery pipeline".
#
# The migrate job reads three secrets from the GitHub *environment* named
# "staging" or "production" (Settings → Environments → <name> → secrets):
#   SUPABASE_ACCESS_TOKEN  Supabase → Account → Access Tokens (starts with sbp_)
#   SUPABASE_DB_PASSWORD   that project's database password
#   SUPABASE_PROJECT_ID    that project's reference

name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

# A newer push to a feature branch cancels checks still running for an older
# one. Never on main/staging, so a migration is never interrupted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          # Public placeholders: the build doesn't contact Supabase (every data
          # page renders per request). Real values live in Vercel.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_placeholder
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_TELEMETRY_DISABLED: "1"

  database:
    name: Database security tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build database from migrations and run RLS tests
        run: bash scripts/test-db.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  migrate:
    name: Apply migrations (${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }})
    needs: [app, database]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    env:
      TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      # The live project. Not secret (it's in the public Supabase URL); used to
      # make sure staging can never touch production and vice versa.
      PRODUCTION_PROJECT_ID: rtosuaubgdeilywnefla
    # Never run two migration jobs against the same database at once.
    concurrency:
      group: supabase-migrations-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # A fixed version: "latest" makes the action call GitHub's API, which is
      # rate limited. Bump this occasionally.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      # Copies the secrets into the job, trimming stray spaces or line breaks
      # that easily slip in when pasting, and checks each one looks right.
      - name: Check the secrets
        env:
          RAW_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RAW_SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          RAW_SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          trim() { local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            raw="RAW_$name"
            value="$(trim "${!raw}")"
            if [ -z "$value" ]; then echo "::error::Repository secret $name is missing or empty"; exit 1; fi
            echo "::add-mask::$value"
            declare "$name=$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          if [[ ! "$SUPABASE_ACCESS_TOKEN" =~ ^sbp_[a-zA-Z0-9_]+$ ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN must start with sbp_ (Supabase → Account → Access Tokens)."
            exit 1
          fi
          if [[ ! "$SUPABASE_PROJECT_ID" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::SUPABASE_PROJECT_ID should be the 20-letter project reference."
            exit 1
          fi
          # Safety net: the wrong environment's secrets must never be used.
          if [ "$TARGET" = "staging" ] && [ "$SUPABASE_PROJECT_ID" = "$PRODUCTION_PROJECT_ID" ]; then
            echo "::error::The staging environment points at the PRODUCTION project. Add the staging project's secrets under Settings → Environments → staging."
            exit 1
          fi
          if [ "$TARGET" = "production" ] && [ "$SUPABASE_PROJECT_ID" != "$PRODUCTION_PROJECT_ID" ]; then
            echo "::error::The production environment doesn't point at the production project ($PRODUCTION_PROJECT_ID)."
            exit 1
          fi
          echo "Secrets look right. Target: $TARGET"

      - name: Connect to the Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # Production only: migrations 1-3 were applied by hand before automation
      # existed; this keeps them recorded as applied. (Staging is built from
      # scratch by the CLI, so it needs no repair.)
      - name: Record migrations applied by hand
        if: env.TARGET == 'production'
        run: supabase migration repair --status applied 20261119000001 20261119000002 20261120000003

      - name: Preview what will run
        run: supabase db push --dry-run

      - name: Apply new migrations
        run: supabase db push

      - name: Show migration history
        run: supabase migration list
